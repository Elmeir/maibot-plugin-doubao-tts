# 豆包语音（Doubao TTS）插件配置模板
# 复制本文件为 config.toml（麦麦首次加载插件也会自动生成），填入你的 API Key 即可。
# ⚠️ config.toml 含 API Key，属敏感文件：请勿上传到 GitHub / 随插件包分发！
# 说明：配置按用途分为多个页签（插件/豆包语音/音色与情感/语速与音量/行为），本文件用 [段名] 对应。

[plugin]
enabled = true            # 插件总开关
config_version = "1.4.0"  # 勿改

[doubao]
api_key = ""              # ← 必填：火山引擎新版控制台 API Key（控制台 → 豆包语音 → API Key 管理）
resource_id = "seed-tts-2.0"  # ⚠️ 须与音色匹配：官方预置音色→seed-tts-2.0；复刻音色(S_开头)→seed-icl-2.0。填错报 "resource ID is mismatched"
audio_format = "mp3"      # 音频编码 mp3（推荐）或 ogg_opus（一般不用改）
sample_rate = 24000       # 采样率 Hz（一般不用改）

[voice_tone]
voice = "小何 2.0"         # 音色：预置音色显示名（见 README 音色表）或直接填 voice_type 音色 ID
emotion = "none"          # 情感（WebUI 下拉点选）：none=无（正常语气）；或 开心/伤心/生气/害怕/惊讶/讨厌/哭泣/抱歉/平静/播音/讲故事
emotion_scale = 1.0       # 情感强度 1~5（配合情感使用）

[speed_loud]
speech_rate = 0           # 语速 -50~100（0=正常）。火山连续数值，麦麦不可自主，仅手动
loudness = 0              # 音量 -50~100（0=正常）。火山连续数值，麦麦不可自主，仅手动

[behavior]
command_enabled = true       # 启用 /说 /语音 手动命令
auto_voice_mode = "llm"      # 麦麦自主语音：llm=由 LLM 自行判断何时用语音（推荐）；probability=按概率偶尔语音；off=仅手动命令
auto_voice_probability = 0.1 # 概率模式的触发概率 0~1（0.1=平均每10轮约1轮语音），仅 probability 模式生效
emotion_mode = "fixed"       # 情感来源：fixed=用 [voice_tone] emotion 固定值；auto=麦麦自主(llm模式)时由 LLM 现场挑
emotion_scale_mode = "fixed" # 情感强度来源：fixed=用 [voice_tone] emotion_scale；auto=LLM 按情感挑 1~5
timeout_seconds = 30         # 请求超时（秒）
max_text_length = 150        # 单条语音最大字数（超过按句切分多条）
fallback_to_text = true      # 合成失败时降级为文字发出
send_error_prompt = true     # 失败时提示用户
