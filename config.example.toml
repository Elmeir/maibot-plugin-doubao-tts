# 豆包/MiMo 语音 TTS 插件配置模板
# 复制本文件为 config.toml（麦麦首次加载插件也会自动生成），填入你的 API Key 即可。
# ⚠️ config.toml 含 API Key，属敏感文件：请勿上传到 GitHub / 随插件包分发！
# 说明：配置按用途分为多个页签（插件主页/豆包语音/MiMo 语音/高级），本文件用 [段名] 对应。
# 主页只放开关与下拉选择；豆包/MiMo 各一个页签改连接与音色；数值与路径归「高级」页。

[plugin]
enabled = true            # 插件总开关
config_version = "1.6.0"  # 勿改
tts_engine = "豆包语音"    # 语音引擎下拉：豆包语音 / MiMo 语音
emotion = "麦麦自主"       # 情感下拉：麦麦自主=LLM 现场挑（默认）；无=正常语气；开心/伤心/生气/害怕/惊讶/讨厌/哭泣/抱歉/平静/播音/讲故事=固定情感
emotion_scale = "麦麦自主" # 情感强度下拉（豆包专用）：麦麦自主=LLM 挑（默认）；1~5=固定档位
command_enabled = true       # 启用 /说 /语音 手动命令
auto_voice_mode = "LLM 自行判断"  # 麦麦自主语音：LLM 自行判断（推荐）/ 概率触发 / 仅手动
voice_content_source = "工具文本" # 工具语音内容来源：工具文本=LLM 传 text 直接朗读（现状）/ 回复生成=LLM 只决定用语音，内容由 reply 生成后自动转语音
fallback_to_text = true      # 合成失败时降级为文字发出
send_error_prompt = true     # 失败时提示用户
sync_chat_context = true     # 发送语音后把原文写回麦麦对话上下文（推荐开启，麦麦才知道自己说过什么）
follow_segmentation = false  # 跟随分段：本轮每一段各自转语音（配合宿主分段/智能分段插件）；关闭只转第一条
cache_enabled = false        # 本地合成缓存：同样文本+音色+情感直接复用音频，不再调 TTS 接口

[doubao]
api_key = ""                 # 语音引擎=豆包语音 时必填：火山引擎新版控制台 API Key
resource_id = "seed-tts-2.0" # ⚠️ 须与音色匹配：官方预置音色→seed-tts-2.0；复刻音色(S_开头)→seed-icl-2.0。填错报 "resource ID is mismatched"
voice = "小何 2.0"            # 音色：预置音色显示名（见 README 音色表）或直接填 voice_type 音色 ID
speech_rate = 0              # 语速 -50~100（0=正常，豆包专用，仅手动）
loudness = 0                 # 音量 -50~100（0=正常，豆包专用，仅手动）
audio_format = "mp3"         # 音频编码 mp3（推荐）或 ogg_opus（一般不用改）
sample_rate = 24000          # 采样率 Hz（一般不用改）

[mimo]
api_key = ""                 # ← 引擎=MiMo 语音 时必填：MiMo 开放平台 API Key（mimo.mi.com → API Key 管理）。敏感信息，勿外传/勿提交
voice_sample = "dxl.wav"     # 复刻音源文件：相对路径默认在插件 src/ 目录下找（默认 dxl.wav）；可填绝对路径。仅支持 wav/mp3，≤10MB
style = ""                   # 自然语言风格指令（可选）：如「语速稍快，声音明亮，语气亲切自然」；留空不传
audio_format = "wav"         # 音频编码（MiMo 固定 wav，勿改）

[behavior]
command_cooldown_seconds = 10 # 同一会话两次语音合成的最小间隔（秒），0=不限流；防刷屏/刷费用
auto_voice_probability = 0.1  # 概率模式的触发概率 0~1（0.1=平均每10轮约1轮语音），仅 probability 模式生效
timeout_seconds = 30          # 请求 TTS 接口超时（秒，豆包/MiMo 通用）
max_text_length = 150         # 单条语音最大字数（超过按句切分多条）
context_prefix = "[语音]"     # 写回上下文时加在原文前的标记；清空则只写原文
cache_dir = ""                # 缓存目录；留空 = 宿主插件数据目录下的 doubao-tts-cache/，建议填绝对路径
cache_max_files = 500         # 缓存文件数上限，超出按最旧优先清理
# /说 与 /语音帮助 已声明为受保护命令（permission=operator），授权在麦麦主配置
# 「插件权限」里管理：全局管理员（permission，如 ["qq:123456"]）或
# command_permissions 按命令放行用户/聊天（WebUI 机器人配置 → 命令权限）

[debug]                       # 调试
enabled = false               # 诊断日志（工具/命令调用细节；日志搜「豆包TTS·调试」）

# 以下为调试页「组件信息」只读展示段：内容由插件加载时自动写入（勿手改）
[tool_doubao_tts_speak]
visibility = ""
description = ""
parameters = ""

[command_doubao_tts_say]
description = ""
pattern = ""

[command_doubao_tts_help]
description = ""
pattern = ""
